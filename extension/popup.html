<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StegoDetect Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1f35, #0f1525);
      border-bottom: 1px solid #21262d;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { color: #fff; }
    .logo-text { font-size: 14px; font-weight: 700; }
    .logo-sub  { font-size: 11px; color: #7d8590; margin-top: 1px; }

    /* Server status card */
    .status-card {
      margin: 12px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #6e7681; flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .status-dot.offline { background: #f85149; }
    .status-label { font-size: 12px; color: #7d8590; }
    .status-value { font-size: 12px; font-weight: 600; }

    /* Toggle */
    .toggle-card {
      margin: 0 12px 12px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle-sub   { font-size: 11px; color: #7d8590; margin-top: 2px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { display: none; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #21262d; border-radius: 24px;
      transition: background 0.2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; bottom: 3px; left: 3px;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #6c63ff; }
    input:checked + .slider::before { transform: translateX(20px); }

    /* Log section */
    .log-header {
      padding: 0 12px 6px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: #7d8590;
    }
    .log-list { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .log-item {
      background: #161b22; border: 1px solid #21262d; border-radius: 8px;
      padding: 8px 10px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .log-badge {
      padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }
    .badge-stego { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.3); }
    .badge-cover { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid rgba(63,185,80,0.3); }
    .badge-error { background: rgba(210,153,34,0.15); color: #d2991a; border: 1px solid rgba(210,153,34,0.3); }
    .log-name { font-size: 11px; color: #7d8590; word-break: break-all; line-height: 1.4; }
    .log-conf { font-size: 10px; color: #484f58; margin-top: 2px; }
    .no-log { text-align: center; color: #484f58; font-size: 12px; padding: 16px 0; }

    /* Open dashboard button */
    .btn-dashboard {
      display: block; width: calc(100% - 24px); margin: 0 12px 12px;
      padding: 10px; text-align: center;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-dashboard:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">StegoDetect Guard</div>
      <div class="logo-sub">Download scanner for steganography</div>
    </div>
  </div>

  <!-- Server status -->
  <div class="status-card">
    <div class="status-row">
      <div class="status-dot" id="srv-dot"></div>
      <div>
        <div class="status-value" id="srv-label">Checking…</div>
        <div class="status-label">localhost:5000</div>
      </div>
    </div>
    <button id="btn-refresh" title="Refresh" style="background:none;border:none;cursor:pointer;color:#7d8590;font-size:16px;">↻</button>
  </div>

  <!-- Enable/disable toggle -->
  <div class="toggle-card">
    <div>
      <div class="toggle-label">Download Scanning</div>
      <div class="toggle-sub">Scan image downloads automatically</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Recent scans log -->
  <div class="log-header">Recent Scans</div>
  <div class="log-list" id="log-list">
    <div class="no-log" id="no-log">No scans yet</div>
  </div>

  <!-- Open web dashboard -->
  <a href="http://localhost:5000" target="_blank" class="btn-dashboard" id="btn-dash">
    Open Web Dashboard →
  </a>

  <script src="popup.js"></script>
</body>
</html>
